server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin caché: cada actualización del panel o de la configuración se ve al toque
    location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }
    location = /config.js  { add_header Cache-Control "no-store, no-cache, must-revalidate"; }

    location / { try_files $uri $uri/ /index.html; }
}
